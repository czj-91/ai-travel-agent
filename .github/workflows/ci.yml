name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: 离线单测（需要联网的用例会自动跳过）
        run: uv run python tests/test_offline.py
      - name: 服务层测试（TestClient，不依赖外部服务）
        run: uv run python tests/test_service.py
      - name: 评测用例与规则自检
        run: uv run python evals/run_eval.py --dry-run

  docker-build:
    name: 镜像可构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像（只验证可构建，不推送）
        run: docker build -t ai-travel-agent:ci .
      - name: 确认密钥不会进镜像
        run: |
          if docker run --rm --entrypoint ls ai-travel-agent:ci -la /app | grep -E '\\.env$'; then
            echo "镜像里出现了 .env，构建失败" && exit 1
          fi
          echo "镜像内无 .env"

  lint:
    name: 代码检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: ruff check
        run: uvx ruff@0.17.4 check .
      - name: ruff format 一致性检查
        run: uvx ruff@0.17.4 format --check .
